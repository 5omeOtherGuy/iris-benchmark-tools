version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      github-actions:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      pip:
        update-types: [minor, patch]
    labels: [dependencies]
