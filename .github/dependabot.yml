version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      github-actions:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: pip
    directory: /
    # requirements-harbor.txt is a uv lock of Harbor; its other pins follow
    # Harbor's constraints, so only Harbor itself is updated here.
    allow:
      - dependency-name: harbor
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      pip:
        update-types: [minor, patch]
    labels: [dependencies]
